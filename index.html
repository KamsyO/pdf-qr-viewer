
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Document</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100vh;
            min-height: 100vh;
            border: none;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>

<body>

    <div id="openingScreen" style="text-align: center; padding: 40px 20px;">

        <h1>View Document</h1>

        <p>
            Click the button below to open the full document.
        </p>

        <a
            href="https://pub-28f655fac77a46cab49a69b0807a0924.r2.dev/ksm%20brochure%20inner.pdf#page=1"
            id="openPdfButton"
            style="
                display: inline-block;
                padding: 15px 25px;
                background: #000;
                color: white;
                text-decoration: none;
                border-radius: 8px;
                font-size: 18px;
            "
        >
            📖 Open PDF
        </a>

    </div>

    <div id="pdfContainer" style="display: none; width: 100%; height: 100vh; overflow: auto; -webkit-overflow-scrolling: touch;">

        <iframe id="pdfViewer" title="PDF document"></iframe>

    </div>

    <script>
        const button = document.getElementById("openPdfButton");
        const openingScreen = document.getElementById("openingScreen");
        const pdfContainer = document.getElementById("pdfContainer");
        const pdfViewer = document.getElementById("pdfViewer");

        const pdfUrl =
            "https://pub-28f655fac77a46cab49a69b0807a0924.r2.dev/ksm%20brochure%20inner.pdf";

        button.addEventListener("click", function (event) {
            event.preventDefault();

            pdfViewer.src = pdfUrl + "#page=1";

            openingScreen.style.display = "none";
            pdfContainer.style.display = "block";
        });
    </script>

</body>
</html>
