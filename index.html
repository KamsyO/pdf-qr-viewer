
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Document</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        #openingScreen {
            text-align: center;
            padding: 40px 20px;
        }

        #openPdfButton {
            display: inline-block;
            padding: 15px 25px;
            background: #000;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
        }

        #directPdfLink {
            display: block;
            margin-top: 20px;
            color: #333;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div id="openingScreen">

        <h1>View Document</h1>

        <p>
            Click the button below to open the full document.
        </p>

        <a href="#" id="openPdfButton">
            📖 Open PDF
        </a>

        <a
            href="https://pub-28f655fac77a46cab49a69b0807a0924.r2.dev/ksm%20brochure%20inner.pdf"
            id="directPdfLink"
            target="_blank"
            rel="noopener noreferrer"
        >
            Having trouble? Open the PDF directly.
        </a>

    </div>

    <script>
        const button = document.getElementById("openPdfButton");

        const pdfUrl =
            "https://pub-28f655fac77a46cab49a69b0807a0924.r2.dev/ksm%20brochure%20inner.pdf";

        button.addEventListener("click", function (event) {
            event.preventDefault();

            const viewerUrl =
                "/pdfjs/web/viewer.html?file="
                + encodeURIComponent(pdfUrl)
                + "#page=1&zoom=page-width";

            window.location.href = viewerUrl;
        });
    </script>

</body>
</html>
