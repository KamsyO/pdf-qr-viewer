
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Document</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        iframe {
            width: 100%;
            height: 100vh;
            border: none;
        }
    </style>
</head>

<body>

    <div id="openingScreen" style="text-align: center; padding: 40px 20px;">

        <h1>View Document</h1>

        <p>
            Click the button below to open the full document.
        </p>

        <a
            href="https://pub-28f655fac77a46cab49a69b0807a0924.r2.dev/10.pdf#page1"
            id="openPdfButton"
            style="
                display: inline-block;
                padding: 15px 25px;
                background: #000;
                color: white;
                text-decoration: none;
                border-radius: 8px;
                font-size: 18px;
            "
        >
            📖 Open PDF
        </a>

    </div>

    <audio id="backgroundMusic" loop>
        <source
            src="https://pub-28f655fac77a46cab49a69b0807a0924.r2.dev/nastelbom-background-music-602518.mp3"
            type="audio/mpeg"
        >
    </audio>

    <div id="pdfContainer" style="display: none; padding: 10px;">
        <div id="pdfPages"></div>
    </div>

    

<script type="module">
    import * as pdfjsLib from
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

    const button = document.getElementById("openPdfButton");
    const music = document.getElementById("backgroundMusic");
    const openingScreen = document.getElementById("openingScreen");
    const pdfContainer = document.getElementById("pdfContainer");
    const pdfPages = document.getElementById("pdfPages");

    const pdfUrl =
        "https://pub-28f655fac77a46cab49a69b0807a0924.r2.dev/10.pdf";

    button.addEventListener("click", async function (event) {
        event.preventDefault();

        // Start music when the reader taps the button.
        try {
            await music.play();
        } catch (error) {
            console.error("Music could not start:", error);
        }

        openingScreen.style.display = "none";
        pdfContainer.style.display = "block";

        pdfPages.innerHTML = "Loading document...";

        try {
            const pdf = await pdfjsLib.getDocument(pdfUrl).promise;

            pdfPages.innerHTML = "";

            for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
                const page = await pdf.getPage(pageNumber);

                const container = document.createElement("div");
                container.style.margin = "0 auto 15px";
                container.style.maxWidth = "900px";
                container.style.background = "#ffffff";
                container.style.boxShadow = "0 1px 5px rgba(0,0,0,0.2)";

                const canvas = document.createElement("canvas");
                canvas.style.display = "block";
                canvas.style.width = "100%";
                canvas.style.height = "auto";

                container.appendChild(canvas);
                pdfPages.appendChild(container);

                const context = canvas.getContext("2d");
                const originalViewport = page.getViewport({ scale: 1 });
                const scale = Math.min(
                    (pdfContainer.clientWidth - 20) / originalViewport.width,
                    2
                );
                const viewport = page.getViewport({ scale: Math.max(scale, 0.1) });

                const pixelRatio = window.devicePixelRatio || 1;
                canvas.width = Math.floor(viewport.width * pixelRatio);
                canvas.height = Math.floor(viewport.height * pixelRatio);

                await page.render({
                    canvasContext: context,
                    viewport: viewport,
                    transform: [pixelRatio, 0, 0, pixelRatio, 0, 0]
                }).promise;
            }
        } catch (error) {
            console.error("PDF loading failed:", error);
            pdfPages.innerHTML =
                "The document could not be displayed. Please check your internet connection and try again.";
        }
    });
</script>


</body>
</html>
